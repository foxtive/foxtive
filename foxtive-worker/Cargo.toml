[package]
name = "foxtive-worker"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Foxtive Worker - Background worker framework for message processing"
repository = "https://github.com/foxtive/foxtive"
authors = ["ahmard"]

[features]
default = ["tracing"]

# Backends
rabbitmq = ["foxtive/rabbitmq", "dep:lapin", "dep:futures-util", "dep:deadpool-lapin"]
redis-stream = ["foxtive/redis", "dep:deadpool-redis", "dep:redis"]
memory = []

# Middleware
rate-limit = ["governor"]
circuit-breaker = []
tracing = ["dep:tracing"]
metrics = ["dep:metrics"]
http = ["dep:axum"]

# Advanced features
batch-processing = []
dead-letter-queue = []

# Integrations
foxtive-supervisor = ["dep:foxtive-supervisor"]
foxtive-cron = ["dep:foxtive-cron"]

[dependencies]
foxtive = { path = "../foxtive", version = "0.26.0" }
foxtive-supervisor = { path = "../foxtive-supervisor", version = "0.3.3", optional = true }
foxtive-cron = { path = "../foxtive-cron", version = "0.5.0", optional = true }

tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1.89"
anyhow = { version = "1.0.101", features = ["backtrace"] }
thiserror = "2.0.18"
tracing = { version = "0.1.44", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
rand = "0.10.1"

# Optional dependencies
governor = { version = "0.10.4", optional = true }
dashmap = { version = "6.1.0", optional = true }
metrics = { version = "0.24.0", optional = true }
lapin = { version = "3.7.2", optional = true }
futures-util = { version = "0.3.30", optional = true }
deadpool-redis = { version = "0.23.0", optional = true }
redis = { version = "1.2.2", optional = true }
deadpool-lapin = { version = "0.13.1", features = ["rt_tokio_1"], optional = true }
axum = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
foxtive-supervisor = { path = "../foxtive-supervisor", version = "0.3.3" }

# [[bench]]
