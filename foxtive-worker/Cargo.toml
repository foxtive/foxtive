[package]
name = "foxtive-worker"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "Foxtive Worker - Background worker framework for message processing"
repository = "https://github.com/foxtive/foxtive"
authors = ["ahmard"]

[features]
default = []

# Backends
rabbitmq = ["foxtive/rabbitmq", "dep:lapin", "dep:futures-util", "dep:deadpool-lapin", "dep:async-rs"]
redis-stream = ["foxtive/redis", "dep:deadpool-redis", "dep:redis"]
memory = []

# Middleware
rate-limit = ["governor"]
circuit-breaker = []
metrics = ["dep:metrics"]
http = ["dep:axum"]

# Advanced features
batch-processing = []
dead-letter-queue = []

# Integrations
foxtive-supervisor = ["dep:foxtive-supervisor"]
foxtive-cron = ["dep:foxtive-cron"]

[dependencies]
foxtive = { path = "../foxtive", version = "1.2.0" }
foxtive-supervisor = { path = "../foxtive-supervisor", version = "0.4.0", optional = true }
foxtive-cron = { path = "../foxtive-cron", version = "0.6.0", optional = true }

tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
async-trait = "0.1.91"
thiserror = "2.0.20"
tracing = { version = "0.1.44" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
rand = "0.10.2"

# Optional dependencies
governor = { version = "0.10.4", optional = true }
dashmap = { version = "6.1.0", optional = true }
metrics = { version = "0.24.6", optional = true }
lapin = { version = "4.10.0", optional = true }
futures-util = { version = "0.3.34", optional = true }
deadpool-redis = { version = "0.23.1", optional = true }
redis = { version = "1.6.0", optional = true }
deadpool-lapin = { version = "0.14.0", features = ["rt_tokio_1"], optional = true }
async-rs = { version = "0.8", default-features = false, features = ["tokio"], optional = true }
axum = { version = "0.8.9", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
foxtive-supervisor = { path = "../foxtive-supervisor", version = "0.4.0" }

