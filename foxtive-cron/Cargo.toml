[package]
name = "foxtive-cron"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Foxtive Cron"
repository = "https://github.com/foxtive/foxtive"
authors = ["ahmard"]

[features]
tokio-macros = ["tokio/macros"]

[dependencies]
cron = "0.17.0"
tracing = "0.1.44"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
async-trait = "0.1.91"
anyhow = { version = "1.0.104", features = ["backtrace"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "signal", "macros"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "time", "rt-multi-thread", "sync"] }
tracing-subscriber = "0.3.23"


[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["tokio-macros"]

[[example]]
name = "advanced"
path = "examples/advanced.rs"
required-features = ["tokio-macros"]

[[example]]
name = "concurrency"
path = "examples/concurrency.rs"
required-features = ["tokio-macros"]

[[example]]
name = "persistence"
path = "examples/persistence.rs"
required-features = ["tokio-macros"]

[[example]]
name = "priority"
path = "examples/priority.rs"
required-features = ["tokio-macros"]

[[example]]
name = "timezone"
path = "examples/timezone.rs"
required-features = ["tokio-macros"]
